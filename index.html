<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Principles" />
  <title>Principles — Learn Design</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-logo">Principles<span class="app-logo-dot">.</span></div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button id="lang-pl" aria-pressed="false">PL</button>
        <button id="lang-en" aria-pressed="true">EN</button>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" id="nav" aria-label="Main">
      <a class="nav-item" href="#/home" data-route="home" aria-current="page">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l10-9 10 9"/><path d="M6 12v11h6v-7h4v7h6V12"/></svg>
        <span data-i18n="nav.daily">Daily</span>
      </a>
      <a class="nav-item" href="#/explore" data-route="explore">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="M18.5 9.5l-2.5 7-7 2.5 2.5-7z" fill="currentColor" fill-opacity="0.18"/></svg>

      </a>
      <a class="nav-item" href="#/quiz" data-route="quiz">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="M11 11a3 3 0 116 0c0 2-3 2.5-3 4.5"/><circle cx="14" cy="20" r="0.8" fill="currentColor" stroke="none"/></svg>

      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="3.5"/><path d="M14 4v3M14 21v3M4 14h3M21 14h3M7 7l2 2M19 19l2 2M7 21l2-2M19 9l2-2"/></svg>
        <span data-i18n="nav.settings">Settings</span>
      </a>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
